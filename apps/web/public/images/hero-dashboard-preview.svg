<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="hdp-title hdp-desc">
  <title id="hdp-title">Nestora dashboard demonstration</title>
  <desc id="hdp-desc">Sample hostel administration dashboard with sidebar, statistics, activity list, and room occupancy bars. Not live data.</desc>
  <defs>
    <linearGradient id="hdp-win" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#f2f2ef"/>
    </linearGradient>
    <filter id="hdp-sh" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#f7f7f5"/>
  <g filter="url(#hdp-sh)">
    <rect x="24" y="28" width="912" height="504" rx="4" fill="#ffffff" stroke="#e9e9e7" stroke-width="1"/>
    <!-- sidebar -->
    <rect x="24" y="28" width="56" height="504" fill="url(#hdp-win)" stroke="#e9e9e7" stroke-width="1"/>
    <rect x="36" y="44" width="32" height="32" rx="4" fill="#ffffff" stroke="#e9e9e7"/>
    <text x="52" y="64" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8c83b8">N</text>
    <!-- nav icons (simplified) -->
    <rect x="40" y="92" width="24" height="24" rx="3" fill="#ebe8f4" stroke="#8c83b8" stroke-opacity="0.35"/>
    <rect x="46" y="98" width="12" height="3" rx="1" fill="#8c83b8"/>
    <rect x="46" y="104" width="12" height="3" rx="1" fill="#8c83b8"/>
    <rect x="40" y="128" width="24" height="24" rx="3" fill="transparent"/>
    <circle cx="52" cy="140" r="6" stroke="#777777" stroke-width="1.5" fill="none"/>
    <rect x="40" y="160" width="24" height="24" rx="3" fill="transparent"/>
    <path d="M46 172h12M46 176h12M46 180h8" stroke="#777777" stroke-width="1.5" fill="none"/>
    <rect x="40" y="192" width="24" height="24" rx="3" fill="transparent"/>
    <rect x="46" y="198" width="12" height="8" rx="1" stroke="#777777" stroke-width="1.5" fill="none"/>
    <rect x="40" y="224" width="24" height="24" rx="3" fill="transparent"/>
    <rect x="46" y="232" width="12" height="6" rx="1" stroke="#777777" stroke-width="1.5" fill="none"/>
    <!-- main -->
    <text x="104" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#777777">Dashboard</text>
    <text x="104" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#343a40">Sunrise Hall: overview</text>
    <text x="104" y="118" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">Sample data for demonstration</text>
    <rect x="740" y="56" width="168" height="28" fill="#f2f2ef" stroke="#e9e9e7" rx="2"/>
    <text x="824" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">Academic year 2025 to 2026</text>
    <line x1="88" y1="138" x2="912" y2="138" stroke="#e9e9e7"/>
    <!-- stat cards -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
      <rect x="104" y="158" width="232" height="88" fill="#ffffff" stroke="#e9e9e7"/>
      <text x="120" y="184" font-size="11" font-weight="500" fill="#777777">Total students</text>
      <text x="120" y="224" font-size="28" font-weight="600" fill="#343a40">248</text>
      <rect x="352" y="158" width="232" height="88" fill="#ffffff" stroke="#e9e9e7"/>
      <text x="368" y="184" font-size="11" font-weight="500" fill="#777777">Occupied rooms</text>
      <text x="368" y="224" font-size="28" font-weight="600" fill="#343a40">186 / 220</text>
      <rect x="600" y="158" width="280" height="88" fill="#ffffff" stroke="#e9e9e7"/>
      <text x="616" y="184" font-size="11" font-weight="500" fill="#777777">Pending fees</text>
      <text x="616" y="224" font-size="28" font-weight="600" fill="#343a40">&#x20b9;42,800</text>
    </g>
    <!-- activity -->
    <rect x="104" y="266" width="392" height="226" fill="#ffffff" stroke="#e9e9e7"/>
    <text x="120" y="296" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#343a40">Recent hostel activity</text>
    <text x="120" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">Illustrative timeline</text>
    <line x1="120" y1="328" x2="480" y2="328" stroke="#e9e9e7"/>
    <text x="120" y="352" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">09:14</text>
    <text x="168" y="352" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#343a40">Room B12 checkout approved</text>
    <line x1="120" y1="364" x2="480" y2="364" stroke="#f2f2ef"/>
    <text x="120" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">08:40</text>
    <text x="168" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#343a40">Attendance marked for Block A</text>
    <line x1="120" y1="400" x2="480" y2="400" stroke="#f2f2ef"/>
    <text x="120" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">Yesterday</text>
    <text x="168" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#343a40">Maintenance ticket #184 closed</text>
    <!-- occupancy -->
    <rect x="512" y="266" width="368" height="226" fill="#ffffff" stroke="#e9e9e7"/>
    <text x="528" y="296" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#343a40">Room occupancy</text>
    <text x="528" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">By room, demo mix</text>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#777777">
      <text x="528" y="348">A-04</text>
      <text x="848" y="348" text-anchor="end" fill="#343a40" font-weight="600">100%</text>
      <rect x="528" y="354" width="336" height="8" rx="4" fill="#f2f2ef"/>
      <rect x="528" y="354" width="336" height="8" rx="4" fill="#8c83b8"/>
      <text x="528" y="388">A-11</text>
      <text x="848" y="388" text-anchor="end" fill="#343a40" font-weight="600">82%</text>
      <rect x="528" y="394" width="336" height="8" rx="4" fill="#f2f2ef"/>
      <rect x="528" y="394" width="276" height="8" rx="4" fill="#8c83b8"/>
      <text x="528" y="428">B-03</text>
      <text x="848" y="428" text-anchor="end" fill="#343a40" font-weight="600">64%</text>
      <rect x="528" y="434" width="336" height="8" rx="4" fill="#f2f2ef"/>
      <rect x="528" y="434" width="215" height="8" rx="4" fill="#8c83b8"/>
      <text x="528" y="468">B-12</text>
      <text x="848" y="468" text-anchor="end" fill="#343a40" font-weight="600">41%</text>
      <rect x="528" y="474" width="336" height="8" rx="4" fill="#f2f2ef"/>
      <rect x="528" y="474" width="138" height="8" rx="4" fill="#8c83b8"/>
    </g>
  </g>
</svg>
