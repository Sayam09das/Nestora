services:
  postgres:
    image: postgres:16-alpine
    container_name: nestora-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nestora
      POSTGRES_PASSWORD: nestora_dev_pw
      POSTGRES_DB: nestora_db
    volumes:
      - nestora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestora -d nestora_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nestora-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nestora_postgres_data:
